<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyAgent</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6b66; --line: #e3e2dd;
    --up: #0f7b4a; --down: #b3261e; --accent: #2b59c3; --warn: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --panel: #1b1b1a; --ink: #ecebe6; --muted: #9a9993; --line: #2c2c2a;
            --up: #3ecf8e; --down: #ff6b5e; --accent: #7aa2ff; --warn: #f0b04a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--up); border-color: currentColor; }
  .pill.bad { color: var(--down); border-color: currentColor; }
  .pill.warn { color: var(--warn); border-color: currentColor; }
  .spacer { flex: 1; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--down);
           background: transparent; color: var(--down); cursor: pointer; }
  button.resume { border-color: var(--accent); color: var(--accent); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .val { font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .up { color: var(--up); } .down { color: var(--down); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
  section h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.q { white-space: normal; min-width: 220px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; }
  .empty { color: var(--muted); padding: 12px 0; }
  svg { width: 100%; height: 160px; display: block; }
  .err { color: var(--down); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PolyAgent</h1>
    <span id="mode" class="pill">—</span>
    <span id="status" class="pill">connecting…</span>
    <span class="spacer"></span>
    <span id="updated" class="pill">—</span>
    <button id="killbtn">Emergency stop</button>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="label">Equity</div><div class="val" id="equity">—</div></div>
    <div class="kpi"><div class="label">P&amp;L ($)</div><div class="val" id="pnl">—</div></div>
    <div class="kpi"><div class="label">P&amp;L (%)</div><div class="val" id="pnlpct">—</div></div>
    <div class="kpi"><div class="label">Drawdown</div><div class="val" id="dd">—</div></div>
    <div class="kpi"><div class="label">Cash</div><div class="val" id="cash">—</div></div>
    <div class="kpi"><div class="label">Fees paid</div><div class="val" id="fees">—</div></div>
    <div class="kpi"><div class="label">Rewards today (accruing)</div><div class="val" id="rwtoday">—</div></div>
    <div class="kpi"><div class="label">Rewards paid</div><div class="val" id="rwpaid">—</div></div>
  </div>
  <div id="lasterr" class="err"></div>

  <section>
    <h2>Equity</h2>
    <svg id="chart" viewBox="0 0 1000 160" preserveAspectRatio="none" aria-label="equity curve"></svg>
  </section>

  <section>
    <h2>Open positions</h2>
    <div class="scroll"><table>
      <thead><tr><th>Market</th><th>Side</th><th class="n">Shares</th><th class="n">Avg cost</th><th class="n">Mark</th><th class="n">Unrealized</th></tr></thead>
      <tbody id="positions"></tbody>
    </table></div>
  </section>

  <section>
    <h2>Trade history</h2>
    <div class="scroll"><table>
      <thead><tr><th>Time</th><th>Market</th><th>Outcome</th><th>Side</th><th class="n">Price</th><th class="n">Shares</th><th class="n">Fee</th><th class="n">Realized</th><th>Strategy</th></tr></thead>
      <tbody id="trades"></tbody>
    </table></div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
const usd = v => (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const signed = v => (v > 0 ? "+" : "") + usd(v).replace("$-", "-$");
const pct = v => (v > 0 ? "+" : "") + (v * 100).toFixed(2) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tokenHeader = () => { const t = localStorage.getItem("polyToken"); return t ? {"X-Token": t} : {}; };
let killed = false;

async function get(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }

function setKpi(id, text, v) { const el = $(id); el.textContent = text; el.className = "val " + (v === undefined ? "" : cls(v)); }

function drawChart(rows) {
  const svg = $("chart");
  if (rows.length < 2) { svg.innerHTML = '<text x="10" y="80" fill="currentColor" opacity=".5" font-size="14">Waiting for data…</text>'; return; }
  const ys = rows.map(r => r.equity), lo = Math.min(...ys), hi = Math.max(...ys), span = (hi - lo) || 1;
  const pts = rows.map((r, i) => `${(i / (rows.length - 1) * 1000).toFixed(1)},${(150 - (r.equity - lo) / span * 140).toFixed(1)}`).join(" ");
  const last = rows[rows.length - 1].pnl_usd;
  const color = getComputedStyle(document.documentElement).getPropertyValue(last >= 0 ? "--up" : "--down");
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

async function refresh() {
  try {
    const [s, eq, pos, tr] = await Promise.all([get("/api/summary"), get("/api/equity?limit=720"), get("/api/positions"), get("/api/trades?limit=100")]);
    $("mode").textContent = s.mode.toUpperCase();
    $("mode").className = "pill " + (s.mode === "live" ? "warn" : "");
    killed = s.kill;
    let st = "running", c = "ok";
    if (s.kill) { st = "killed"; c = "bad"; }
    else if (s.halt) { st = "halted: " + s.halt.reason; c = "bad"; }
    else if (s.heartbeat_age_sec === null || s.heartbeat_age_sec > 300) { st = "agent not responding"; c = "warn"; }
    $("status").textContent = st; $("status").className = "pill " + c;
    $("killbtn").textContent = s.kill ? "Resume" : "Emergency stop";
    $("killbtn").className = s.kill ? "resume" : "";
    $("updated").textContent = s.updated ? "updated " + new Date(s.updated * 1000).toLocaleTimeString() : "no data yet";
    setKpi("equity", usd(s.equity));
    setKpi("pnl", signed(s.pnl_usd), s.pnl_usd);
    setKpi("pnlpct", pct(s.pnl_pct), s.pnl_pct);
    setKpi("dd", (s.drawdown * 100).toFixed(2) + "%");
    setKpi("cash", usd(s.cash));
    setKpi("fees", usd(s.fees_paid));
    setKpi("rwtoday", usd(s.rewards_today || 0));
    setKpi("rwpaid", usd(s.rewards_paid || 0));
    $("lasterr").textContent = s.last_error ? "Last cycle error: " + s.last_error.error : "";
    drawChart(eq);
    $("positions").innerHTML = pos.length ? pos.map(p => `<tr><td class="q">${esc(p.question)}</td><td>${esc(p.outcome)}</td>
      <td class="n">${p.size.toFixed(2)}</td><td class="n">${p.avg_cost.toFixed(3)}</td><td class="n">${p.mark == null ? "—" : p.mark.toFixed(3)}</td>
      <td class="n ${cls(p.unrealized)}">${signed(p.unrealized)}</td></tr>`).join("") : '<tr><td colspan="6" class="empty">No open positions.</td></tr>';
    $("trades").innerHTML = tr.length ? tr.map(t => `<tr><td>${new Date(t.ts * 1000).toLocaleString()}</td><td class="q">${esc(t.question)}</td>
      <td>${esc(t.outcome)}</td><td>${esc(t.side)}</td><td class="n">${t.price.toFixed(3)}</td><td class="n">${t.size.toFixed(2)}</td>
      <td class="n">${usd(t.fee)}</td><td class="n ${cls(t.realized_pnl)}">${t.side === "BUY" ? "—" : signed(t.realized_pnl)}</td><td>${esc(t.strategy || "settlement")}</td></tr>`).join("")
      : '<tr><td colspan="9" class="empty">No trades yet. The agent only trades when an opportunity clears its edge and confidence thresholds.</td></tr>';
  } catch (e) {
    $("status").textContent = "dashboard error"; $("status").className = "pill bad";
  }
}

$("killbtn").onclick = async () => {
  const path = killed ? "/api/resume" : "/api/kill";
  if (!killed && !confirm("Cancel all open orders and halt trading?")) return;
  let r = await fetch(path, {method: "POST", headers: tokenHeader()});
  if (r.status === 401) {
    const t = prompt("Dashboard token:"); if (!t) return;
    localStorage.setItem("polyToken", t);
    r = await fetch(path, {method: "POST", headers: tokenHeader()});
  }
  refresh();
};
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
